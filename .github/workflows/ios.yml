name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project SchoolBell.xcodeproj -scheme SchoolBell \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SchoolBell.app Payload/
          test -f Payload/SchoolBell.app/SchoolBell
          test -f Payload/SchoolBell.app/class-bell.wav
          test -f Payload/SchoolBell.app/dismissal-bell.wav
          zip -qry SchoolBell.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolBell-iPhone
          path: SchoolBell.ipa
          if-no-files-found: error
